
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | AgriNiramaya</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <a href="index.html" class="logo">
            <span class="logo-icon">?</span>
            <h2>AgriNiramaya</h2>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="nav-buttons">
            <a href="login.html" class="btn btn-outline">Login</a>
        </div>

    </header>

    <main class="auth-section">

        <div class="auth-card">

            <div class="auth-heading">
                <span class="auth-icon">?</span>
                <h1>Create Account</h1>
                <p>Join AgriNiramaya and manage your farm smarter</p>
            </div>

            <form class="auth-form" id="signupForm" action="/signup" method="POST">

                <div class="form-group">
                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        name="full_name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>

                    <input
                        type="email"
                        id="signupEmail"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>

                    <div class="password-field">

                        <input
                            type="password"
                            id="signupPassword"
                            name="password"
                            placeholder="Create a password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="toggleSignupPassword"
                        >
                            Show
                        </button>

                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="password-field">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirm_password"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="toggleConfirmPassword"
                        >
                            Show
                        </button>

                    </div>
                </div>

                <label class="terms-option">
                    <input type="checkbox" id="terms" required>

                    <span>
                        I agree to the
                        <a href="terms.html">Terms & Conditions</a>
                    </span>
                </label>

                <button type="submit" class="login-button">
                    Create Account
                </button>

            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </main>

    <footer class="auth-bottom">
        © 2026 AgriNiramaya | EDI Project
    </footer>

</body>

</html>
